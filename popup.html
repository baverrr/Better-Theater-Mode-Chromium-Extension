<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 14px 16px;
        width: 240px;
        font: 13px/1.4 system-ui, sans-serif;
        background: #0f0f0f;
        color: #f1f1f1;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        cursor: pointer;
      }
      input {
        accent-color: #3ea6ff;
      }
      p {
        margin: 10px 0 0;
        color: #aaa;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Better Theater Mode</h1>
    <label><input type="checkbox" id="enabled" /> Enabled</label>
    <label><input type="checkbox" id="autoTheater" /> Always open videos in theater</label>
    <label><input type="checkbox" id="hideScrollbar" /> Hide scrollbar</label>
    <label><input type="checkbox" id="otherSites" /> Other sites (Twitch, Kick, …)</label>
    <p>Press <b>T</b> on a video to toggle theater mode. Move the mouse to the top edge to show the header. On other sites, press <b>T</b> or use their theater button; Esc also exits.</p>
    <script src="popup.js"></script>
  </body>
</html>
